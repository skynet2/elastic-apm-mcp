version: 2

builds:
  - main: ./cmd/elastic-apm-mcp
    binary: elastic-apm-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Ship linux/amd64, darwin/amd64, darwin/arm64, windows/amd64.
    # Drop linux/arm64 and windows/arm64.
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
