url: https://kibana.example.com
api_key: your-base64-kibana-api-key
headers:
  CF-Access-Client-Id: your-cf-client-id
  CF-Access-Client-Secret: your-cf-client-secret
timeout: 30s
log_level: info
app_logs_index: fluent-bit-*   # Index pattern for application/container stdout logs (default: fluent-bit-*)
